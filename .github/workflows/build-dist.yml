name: Build dist

# Rebuild the committed Action bundle (dist/index.js and its runtime
# companions) and push it back to the pull request branch automatically, so
# contributors never have to run `npm run build` locally.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  build-dist:
    name: Rebuild and commit dist
    runs-on: ubuntu-latest
    # Only branches in this repo can be pushed to. Fork PRs get a read-only
    # token, so the freshness guard below handles them instead.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit dist if it changed
        run: |
          if [ -z "$(git status --porcelain dist/)" ]; then
            echo "dist is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: rebuild dist"
          git push

  verify-dist:
    name: Verify dist (fork PRs)
    runs-on: ubuntu-latest
    # Fork PRs cannot be pushed to, so just fail loudly if the bundle is stale.
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the changes."
            git diff dist/
            exit 1
          fi
