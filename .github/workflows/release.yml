name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-tag:
    name: Build dist and finalize release tags
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # dist/ is gitignored during development, so the release-please release
      # commit has no bundle yet. Build it here, commit it ON TOP of main, and
      # point the release tag at that new commit. The tag stays on main's
      # history, so release-please can always detect the previous release
      # boundary on the next run (unlike the old off-main "chore: add dist"
      # commit, which broke boundary detection and duplicated the changelog).
      - name: Commit dist and move tags to the release commit
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: ${{ needs.release-please.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/index.js dist/index.js.map dist/sourcemap-register.js dist/licenses.txt
          git commit -m "chore: build dist for ${TAG_NAME}"
          # Guard against a concurrent push to main during the release run.
          git pull --rebase origin main
          git push origin HEAD:main
          # Move both the release tag and the floating major tag to the commit
          # that actually carries the bundle.
          git tag -fa "${TAG_NAME}" -m "${TAG_NAME}"
          git push origin "${TAG_NAME}" --force
          git tag -fa "v${MAJOR}" -m "Update v${MAJOR} tag to ${TAG_NAME}"
          git push origin "v${MAJOR}" --force

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

  publish-npm-manual:
    name: Publish to npm (Manual)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
